<!DOCTYPE html>
<html lang="ar" dir="rtl" >
<head>
    <meta charset="UTF-8">
    <title>انشاء حساب</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/signin-responsive.css') }}">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

</head>
<body >
    <header>
        <img src="{{ url_for('static', filename='images/logo_ar.png') }}" alt="website logo" class="logo">

        <div class="signin">
            <a id="login" class="login" href="{{ url_for('login') }}">تسجيل الدخول</a>
            <a id="register" class="register" href="{{ url_for('register') }}">إنشاء حساب</a>
        </div>
    </header>

    <div class="register-body">
        <div class="left">
            <div class="card one">
                دون ثم احفظ
            </div>
            <img src="{{ url_for('static', filename='images/cards-logo.png') }}" alt="" class="mini-card">
        </div>
        <div class="center">

            <form class="form" id="form">
                <div class="form-head">
                    <p class="title">
                    انشاء حساب
                    </p>
                    <p class="sub-title">
                        ابدأ رحلتك في الحفظ الذكي من هنا!
                    </p>
                </div>
                <span>
                    الاسم الكريم
                </span>
                <input type="text" id="name" class="name" placeholder="الاسم" name="username"> </input>
                <span>
                    البريد الالكتروني
                </span>
                <input  type="email" name="email" id="email" class="email" placeholder="البريد الالكتروني">     </input>
                <span>
                    كلمة السر
                </span>
                <input type="password" id="password" class="password" placeholder="كلمة السر" name="password">

                </input>
                <br>
                <button id="submit-register">
                    انشاء حساب
                </button>
            </form>

        </div>
        <div class="right">
            <img src="{{ url_for('static', filename='images/cards-logo.png') }}" alt="" class="mini-card">
            <div class="card one">
                وصول سهل للمعلومات
            </div>
        </div>
    </div>


    <script src="{{ url_for('static',filename='js/register.js') }}"></script>

</body>
</html>
