<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>التحقق من الرمز</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sendOtp.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/signin-responsive.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/send-otp-responsive.css') }}">


    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <header>
        <img src="{{ url_for('static', filename='images/logo_ar.png') }}" alt="website logo" class="logo">

        <div class="signin">
            <i class="fa-solid fa-bars" id="bar"></i>
            <a id="login" class="login" href="{{ url_for('login') }}">تسجيل الدخول</a>
            <a id="register" class="register" href="{{ url_for('register') }}">إنشاء حساب</a>
        </div>
    </header>

</head>
<body class="login-body">
    <div class="circle">
        <div class="center">

            <form action="post" class="form" id="form">
                <div class="form-head">
                    <p class="title">
                   أدخل رمز التحقق
                    </p>
                    <p class="sub-title">
                        لقد أرسلنا رمزا من ستة أرقام الى البريد المعني
                    </p>
                </div>

                <input  type="number" name="otp" id="otp" class="email" placeholder="الرمز المكون من 6 ارقام">     </input>

                <a href="" class="resend-otp">
                    لم يصلك الرمز؟
                </a>
                <button id="submit-otp">
                    تأكيد
                </button>
            </form>

        </div>
    </div>
</body>
</html>
